server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers (Lighthouse Best Practices Fix) ───────────────────────
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer policy - don't leak full URL to 3rd parties
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions policy - disable unused browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS - enforce HTTPS (hanya jika sudah pakai HTTPS/Cloudflare)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets (JS, CSS, Images, Fonts) for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        # Tetap pasang security headers di sini juga
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # No-cache untuk HTML agar selalu fresh (penting untuk SPA routing)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy ALL API requests to backend (GET, POST, PUT, PATCH, DELETE)
    location /api/ {
        proxy_pass http://be:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward cookies for session authentication
        proxy_set_header Cookie $http_cookie;
        # Forward Authorization header
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;
        # Allow all HTTP methods
        proxy_method $request_method;
        # No buffering for real-time
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

