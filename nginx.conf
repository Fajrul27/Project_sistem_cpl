events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Dynamic WebSocket Upgrade Mapping (Supports both HTTP and WebSocket cleanly)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream with keepalive connection pool to backend
    upstream backend {
        server be:8002;
        keepalive 64;
    }

    server {
        listen 80;
        server_name xeranet.my.id;

        # Proxy /api requests to Backend Service (container name 'be')
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;

            # Timeouts - prevent hanging connections
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;

            # Real IP headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Handle all other requests by proxying to Frontend Service (container name 'fe')
        # Assuming FE serves static files or acts as web server on port 80
        location / {
            proxy_pass http://fe:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
