worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keepalive timeout to reduce TCP handshake latency under heavy concurrency
    keepalive_timeout 120s;
    keepalive_requests 100000;

    # Enable GZIP Compression to reduce JSON response payload size
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json text/plain application/javascript text/css;

    # Upstream PM2 Node.js Cluster Backend container
    upstream backend_cluster {
        server be:5000;
        keepalive 64;
    }

    # Upstream Frontend React app container
    upstream frontend_server {
        server fe:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name xeranet.my.id localhost;

        # Proxy /api requests to PM2 Node.js Cluster Backend
        location /api {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Extended Timeouts for high queue concurrency under 500+ user peak load
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffer tuning
            proxy_buffers 16 32k;
            proxy_buffer_size 64k;
        }

        # Frontend Static / React SPA App
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
