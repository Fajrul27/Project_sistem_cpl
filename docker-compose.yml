version: '3.8'

services:
  # 1. MariaDB Database Service
  db:
    image: mariadb:10.11
    container_name: sistem_cpl_db
    restart: always
    command: --max_connections=1000 --innodb_buffer_pool_size=1G
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistem_cpl
    ports:
      - "3307:3306" # Mapped to 3307 to avoid local MySQL conflicts
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. Redis Shared Cache Service
  redis:
    image: redis:7-alpine
    container_name: sistem_cpl_redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  # 3. Backend PM2 Cluster Service (Multi-Core PM2 Cluster + Prisma + Redis)
  be:
    build: ./be
    container_name: sistem_cpl_be
    env_file:
      - ./be/.env
    restart: always
    ports:
      - "5000:5000"
      - "8002:8002"
    volumes:
      - ./private.key:/app/private.key:ro
      - ./public.key:/app/public.key:ro
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://root:root@db:3306/sistem_cpl?connection_limit=30&pool_timeout=60"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
      JWT_PRIVATE_KEY_PATH: /app/private.key
      JWT_PUBLIC_KEY_PATH: /app/public.key
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Otomatis Generate Prisma & Jalankan PM2 Cluster Mode tanpa ketik manual!
    command: sh -c "npx prisma generate && pm2-runtime start ecosystem.config.cjs"

  # 4. Frontend Web App Service
  fe:
    build:
      context: ./fe
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: 740401836948-58gicuta3mgurqhe3igdfuf4cgol0dgj.apps.googleusercontent.com
    container_name: sistem_cpl_fe
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - be

  # 5. Nginx High-Performance Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: sistem_cpl_nginx
    restart: always
    ports:
      - "8880:80"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - be
      - fe

  # 6. Database Management UI Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sistem_cpl_phpmyadmin
    restart: always
    ports:
      - "8181:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 200M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 600
    depends_on:
      - db

volumes:
  db_data:
